<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="480" rx="36" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid/Pattern -->
  <circle cx="200" cy="180" r="140" fill="url(#glowGrad)"/>
  <circle cx="200" cy="180" r="100" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.6"/>
  
  <!-- Stylized Figure / Silhouette -->
  <!-- Shoulders / Body -->
  <path d="M100 420 C100 330, 140 300, 200 300 C260 300, 300 330, 300 420 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Collar / Neck -->
  <path d="M175 295 L200 330 L225 295 Z" fill="#0f172a"/>
  
  <!-- Head -->
  <ellipse cx="200" cy="205" rx="58" ry="70" fill="#334155"/>
  
  <!-- Modern Geometric Initials (TQ) Monogram -->
  <circle cx="200" cy="205" r="54" fill="url(#accentGrad)" opacity="0.95"/>
  <text x="200" y="222" font-family="Inter, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">TQ</text>
  
  <!-- Decorative tech badge -->
  <g transform="translate(130, 395)">
    <rect width="140" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="4" fill="#10b981"/>
    <text x="75" y="22" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">TÙNG QUÂN</text>
  </g>
</svg>
